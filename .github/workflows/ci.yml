name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        deps: [highest]
        include:
          - php: '8.1'
            deps: lowest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Kiểm composer.json
        run: composer validate --strict

      # PHP 8.1 chỉ chạy được Laravel 10, mà mọi bản Laravel 10 đều bị Composer chặn vì lỗ hổng
      # bảo mật: trên 8.1 chỉ test lõi SDK, phần Laravel test trên 8.2+.
      - name: Bỏ bộ test Laravel (PHP 8.1)
        if: matrix.php == '8.1'
        run: composer remove --dev orchestra/testbench --no-update

      - name: Cài thư viện
        run: |
          if [ "${{ matrix.deps }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --no-interaction --no-progress
          fi

      - name: PHPStan
        if: matrix.php != '8.1'
        run: composer analyse

      - name: PHPUnit
        run: |
          if [ "${{ matrix.php }}" = "8.1" ]; then
            vendor/bin/phpunit --testsuite SDK
          else
            composer test
          fi
